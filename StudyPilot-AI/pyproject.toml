[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-ai"
version = "1.0.0"
description = "StudyPilot AI - turn PDF/TXT notes into summaries, grounded answers, quizzes and key concepts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.37",
    "pymupdf>=1.24",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
generative = ["transformers>=4.40", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
